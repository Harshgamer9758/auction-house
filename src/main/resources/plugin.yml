name: AuctionHouse
version: '1.0.0'
main: com.blockmart.auctionhouse.AuctionHouse
api-version: '1.16'
author: harsh
commands:
  ah: 
    description: Main Auction House command.
    usage: /<command>
    aliases: [auction]
    permission: auctionhouse.use
permissions:
  auctionhouse.use:
    description: Allows access to the auction house.
    default: true
  auctionhouse.admin:
    description: Allows admin commands for auction house.
    default: op