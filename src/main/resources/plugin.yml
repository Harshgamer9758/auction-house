main: com.blockmart.auctionhouse.AuctionHouse
name: AuctionHouse
version: '1.0.0'
api-version: '1.20'
author: BlockMart
description: A feature-rich auction house plugin with escrow and bidding.
commands:
  auction:
    description: Main auction house command.
    usage: /auction [list|sell <price>|bid <id> <amount>|claim|cancel <id>]
    permission: auctionhouse.player
permissions:
  auctionhouse.player:
    description: Allows access to basic auction commands.
    default: true
  auctionhouse.admin:
    description: Allows administrative auction commands.
    default: op
