main: com.blockmart.auctionhouse.AuctionHousePlugin
name: AuctionHouse
version: '1.0.0'
api-version: '1.20'
author: harsh
description: An advanced auction house plugin with escrow and bidding features.
dependencies:
  server:
    - Vault
commands:
  auction:
    description: Main command for the Auction House.
    usage: /<command> [list|sell|bid|collect]
    permission: auctionhouse.player
    permission-message: You do not have permission to use the Auction House.
permissions:
  auctionhouse.player:
    description: Allows players to use the Auction House.
    default: true
  auctionhouse.admin:
    description: Allows administrators to manage the Auction House.
    default: op