main: com.blockmart.auctionhouse.AuctionHousePlugin
name: AuctionHouse
version: '1.0.0'
api-version: '1.20'
author: harsh
description: A feature-rich auction house with escrow and bidding functionalities.
commands:
  auction:
    description: Main auction house command.
    usage: /auction [list|sell|bid|collect]
    permission: auctionhouse.use
    permission-message: You do not have permission to use the auction house.
permissions:
  auctionhouse.use:
    description: Allows use of auction house commands.
    default: true
  auctionhouse.admin:
    description: Allows administrative auction house commands.
    default: op