main: com.blockmart.auctionhouse.AuctionHousePlugin
name: AuctionHouse
version: '1.0.0'
api-version: '1.20'
author: BlockMart
softdepend: [Vault]
commands:
  ah: 
    description: Main auction house command.
    usage: /<command>
    aliases: [auctionhouse]
  sellitem: 
    description: Puts the item in your hand up for auction.
    usage: /<command> <price>
  bid: 
    description: Places a bid on an auction.
    usage: /<command> <auction_id> <amount>
permissions:
  auctionhouse.admin: 
    description: Allows access to admin commands.
    default: op
  auctionhouse.use: 
    description: Allows players to use the auction house.
    default: true